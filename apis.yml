apis:
- aid: suse:suma-api
  name: SUSE Manager API
  description: JSON-based "A-REST" API for SUSE Manager (SUMA), used to manage systems, channels, configuration,
    errata, and users across Linux infrastructure. Calls use GET for retrievals, POST for changes, and
    POST to "delete" endpoints for deletions.
  humanURL: https://documentation.suse.com/suma/4.3/api/suse-manager/index.html
  baseURL: https://manager.example.com/rhn/manager/api
  tags:
  - Systems Management
  - Linux
  - SUSE Manager
  - Configuration
  properties:
  - type: Documentation
    url: https://documentation.suse.com/suma/4.3/api/suse-manager/index.html
  - type: API Overview
    url: https://documentation.suse.com/suma/5.0/en/suse-manager/reference/help/api-overview.html
- aid: suse:rancher-api
  name: SUSE Rancher API
  description: REST API for SUSE Rancher Prime Kubernetes management platform, used to manage clusters,
    projects, workloads, users, and policies. Supports v3 API endpoints with bearer token authentication.
  humanURL: https://documentation.suse.com/cloudnative/rancher-manager/latest/en/api/v3-rancher-api-guide.html
  baseURL: https://rancher.example.com/v3
  tags:
  - Kubernetes
  - Cluster Management
  - Rancher
  properties:
